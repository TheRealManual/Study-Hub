version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "No dependencies needed for static site"
    build:
      commands:
        - echo "Pure frontend static site - no build process needed"
        - echo "Dynamic discovery handles all class and topic detection"
  artifacts:
    baseDirectory: .
    files:
      - index.html
      - classes/**/*
    excludeFiles:
      - node_modules/**/*
      - .git/**/*
      - server.js
      - create-topic.js
      - study-material-generator.js
      - template-study-material.json
      - package.json
      - "*.bat"
      - "*.txt"
      - build-study-index.js