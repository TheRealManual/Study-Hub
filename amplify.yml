version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "📁 Generating study materials manifest..."
        - node build-manifest.js
    build:
      commands:
        - echo "✅ Study Hub build completed with dynamic manifest"
  artifacts:
    baseDirectory: .
    files:
      - index.html
      - manifest.json
      - classes/**/*
      - launch-study-hub.bat
      - build-manifest.js
      - dev-server.js
      - package.json
    excludeFiles:
      - node_modules/**/*
      - .git/**/*
      - study-material-generator.js
      - template-study-material.json
      - package.json
      - "*.bat"
      - "*.txt"
      - build-study-index.js